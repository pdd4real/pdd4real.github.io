# =====================================================
# NexT 主题自定义配置（会覆盖 themes/next/_config.yml 的对应项）
# 文档: https://theme-next.js.org/docs/theme-settings/
# =====================================================

# 布局方案：Gemini —— 经典的单栏 + 侧边栏
scheme: Gemini

# 暗黑模式（页面右上角有明暗切换按钮）
darkmode: true

# 导航菜单
menu:
  home: / || fa fa-home
  about: /about/ || fa fa-user
  tags: /tags/ || fa fa-tags
  categories: /categories/ || fa fa-th
  archives: /archives/ || fa fa-archive

# 侧边栏
sidebar:
  position: left
  display: post

# 头像：本地引用（从 GitHub 头像同步，改头像后需重新下载）
avatar:
  url: /images/avatar.png
  rounded: true
  rotated: false

# 社交链接
social:
  GitHub: https://github.com/pdd4real || fab fa-github

# 页脚
footer:
  # 不显示 "Powered by Hexo & NexT.Gemini"
  powered: false
  icon:
    # 爱心 → 雪花
    name: fa fa-snowflake
    animated: false
    color: "#7ec8e3"

social_icons:
  enable: true
  icons_only: false
  transition: true

toc:
  enable: true
  number: false
  wrap: false
  expand_all: false
  max_depth: 6

custom_file_path:
  style: source/_data/styles.styl

# 数学公式：由 hexo-filter-mathjax 转换为 MathJax 可渲染的 HTML
math:
  every_page: false
  mathjax:
    enable: true
    tags: ams

# 颜色方案暂不在这里固定，待确认预览方案后只替换配色变量
